<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canvas con Desplazadores</title>

  <style>
    html, body { margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f6f6f6; }

    .panel {
      position: fixed;
      top: 12px;
      left: 12px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      z-index: 10;
      width: 300px;
    }

    .row { margin-bottom: 10px; }
    label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
    input[type="range"] { width: 100%; }

    canvas {
      display: block;
      margin: 0 auto;
      background: #ff8;
      border: 1px solid #ccc;
      margin-top: 90px; /* deja espacio para el panel */
    }
  </style>
</head>

<body>
  <!-- Panel de controles -->
  <div class="panel">
    <div class="row">
      <label>
        Círculos: <span id="circlesValue">5</span>
      </label>
      <input id="circlesSlider" type="range" min="1" max="50" value="5" />
    </div>

    <div class="row">
      <label>
        Ancho canvas: <span id="widthValue">900</span> px
      </label>
      <input id="widthSlider" type="range" min="300" max="1200" value="900" />
    </div>

    <div class="row">
      <label>
        Alto canvas: <span id="heightValue">450</span> px
      </label>
      <input id="heightSlider" type="range" min="200" max="800" value="450" />
    </div>
  </div>

  <!-- Canvas -->
  <canvas id="canvas"></canvas>

  <script src="./js/main.js"></script>
</body>
</html>
